server {
    listen 80;
    server_name localhost;

    # Frontend Angular/React.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Backend Spring Boot (tous les endpoints backend)
    location /bill {
        proxy_pass http://adbbafe0aa8bc44eca9cd4bd0d8d9779-2044885311.ca-central-1.elb.amazonaws.com:8080/bill;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /category {
        proxy_pass http://adbbafe0aa8bc44eca9cd4bd0d8d9779-2044885311.ca-central-1.elb.amazonaws.com:8080/category;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard {
        proxy_pass http://adbbafe0aa8bc44eca9cd4bd0d8d9779-2044885311.ca-central-1.elb.amazonaws.com:8080/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /product {
        proxy_pass http://adbbafe0aa8bc44eca9cd4bd0d8d9779-2044885311.ca-central-1.elb.amazonaws.com:8080/product;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user {
        proxy_pass http://adbbafe0aa8bc44eca9cd4bd0d8d9779-2044885311.ca-central-1.elb.amazonaws.com:8080/user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
